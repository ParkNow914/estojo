<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estojo · a barra de apps, nos dois clientes</title>
<!-- ⭐⭐ **A TELA QUE MAIS IMPORTA DEPOIS DA PÁGINA DO NEGÓCIO**, e a única aqui
     que mostra a MESMA coisa nos DOIS clientes lado a lado. Ela existe porque a
     barra de apps é onde o produto decide onde cada coisa mora — e porque os dois
     clientes já DIVERGIRAM nela.

     ⛔ **A divergência, medida:** no web o item NÃO tem ícone; no Flutter tem, e
     o ícone é o que distingue uma tela NOSSA de uma que veio de um serviço de
     terceiro (`check_circle_outline` × `extension_outlined`). Quem for redesenhar
     precisa saber que não existe «o item da barra»: existem dois, e um deles
     carrega uma informação que o outro não dá.

     ⚠️ **A coluna do web NÃO EXISTE no navegador do celular.** `@media (max-width:
     720px) { .sidebar { display: none } }` — abaixo de 720px a barra de apps e a
     lista de conversas desaparecem, sem nada no lugar. No aplicativo a mesma lista
     vive numa gaveta, que continua alcançável. É por isso que a coluna da direita
     é a única que uma pessoa de celular vê hoje.

     ⚠️ A coluna do Flutter é reprodução APROXIMADA: as medidas são as do
     `ListTile` denso que o código usa (título 14, legenda 11, ícone 18, recuo 16),
     mas a altura final é do layout do Flutter, não deste HTML.

     ⭐ A conta reproduzida é de quem OPERA UM NEGÓCIO e usa três serviços — o
     cenário de hoje, não um exagero: `agenda` vem instalada em toda conta,
     `sohautos` declara 2 telas e o `comcontabil-cliente` declara 6. O censo do
     produto (SUBAPPS.md §9) tem 5 serviços com tela e 26 telas somadas. -->
<style>
:root {
  --bg: #131211;
  --panel: #1B1918;
  --panel-2: #242120;
  --line: #322E2B;
  --text: #EDEAE5;
  --muted: #A49C93;
  --fraco: #8F877F;
  --accent: #6EA8FE;
  --accent-fraco: #23324A;
  --t-apoio: 13px;
  --t-mini: 12px;
  --t-micro: 11px;
  --e1: 4px; --e2: 8px; --e3: 12px; --e4: 16px;
  --r-menu: 16px;
  --fonte: "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 var(--fonte) }
.par { display:flex; flex-wrap:wrap; gap:26px; padding:18px 14px 40px }
.lado { min-width:0 }
.lado > h2 { margin:0 0 2px; font-size:var(--t-mini); text-transform:uppercase;
  letter-spacing:.08em; color:var(--fraco); font-weight:620 }
.lado > p { margin:0 0 10px; font-size:var(--t-micro); color:var(--muted); max-width:19rem }

/* ══ o WEB: a coluna de 190px do `.shell` ═════════════════════════════════ */
.sidebar { width:190px; border-right:1px solid var(--line); background:var(--bg);
  display:flex; flex-direction:column; min-height:0 }
.sidebar-top { padding:var(--e3) var(--e4); border-bottom:1px solid var(--line) }
.sidebar-top strong { font-size:var(--t-micro); font-weight:620; letter-spacing:.08em;
  text-transform:uppercase; color:var(--fraco) }
.sessions { padding:var(--e2); display:flex; flex-direction:column; gap:2px }
.sessions > button { display:block; width:100%; text-align:left; background:none;
  border:none; border-radius:var(--r-menu); padding:var(--e2) var(--e3);
  font:inherit; color:var(--text); cursor:pointer }
.sessions > button > span:first-child { display:block; font-size:var(--t-apoio);
  font-weight:520; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
/* ⚠️ A explicação é PERMANENTE, e é ela que dá altura ao item: numa coluna de
   190px ela quebra em duas e três linhas. «com o amigo e com quem você
   encontrou» ensina uma vez e é ruído nas outras duzentas. */
.sessions > button .hint { display:block; margin-top:2px; font-size:var(--t-micro);
  color:var(--fraco); line-height:1.35 }
/* ⛔ O item atual é um CARTÃO PREENCHIDO e os outros são texto solto: dois
   pesos visuais para itens do mesmo tipo. */
.sessions > button.atual { background:var(--accent-fraco); color:var(--text);
  box-shadow:inset 2px 0 0 var(--accent) }
/* ⛔ **E a legenda do item selecionado reprovava — só no escuro.** Ela usa
   `--fraco`, calibrado contra o `--bg`; o item atual troca o fundo pelo
   `--accent-fraco` e o par cai para 3,65:1 em 11px. `--muted` serve aos dois
   fundos. Foi achado por varredura do DOM, não olhando. */
.sessions > button.atual .hint { color:var(--muted) }
.sidebar .mais { margin:var(--e2) 10px 14px; padding:7px 10px; width:calc(100% - 20px);
  background:none; border:1px dashed var(--line); border-radius:var(--e2);
  color:var(--muted); font:inherit; font-size:12.5px; cursor:pointer; text-align:left }

/* ══ o APP: a gaveta de 304px do Flutter ══════════════════════════════════ */
.gaveta { width:304px; background:var(--panel); display:flex; flex-direction:column }
.tile { display:flex; align-items:flex-start; gap:var(--e4);
  padding:var(--e2) var(--e4); min-height:64px; background:none; border:none;
  font:inherit; color:var(--text); text-align:left; cursor:pointer; width:100% }
.tile .ic { flex:none; width:18px; height:18px; margin-top:3px; color:var(--muted) }
.tile .txt { min-width:0 }
.tile .tt { display:block; font-size:14px; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis }
.tile .sub { display:block; font-size:var(--t-micro); color:var(--muted); line-height:1.35 }
.gaveta .conta { padding:var(--e3) var(--e4); display:flex; align-items:center; gap:var(--e3) }
.gaveta .conta .tt { font-weight:600 }
.divisor { height:1px; background:var(--line) }
.gaveta .rot { padding:14px var(--e4) 6px; font-size:var(--t-mini); color:var(--muted);
  letter-spacing:.5px }
</style></head><body>
<div class="par">

  <section class="lado">
    <h2>web · a coluna de 190px</h2>
    <p>Sem ícone: varrer a lista exige ler. ⛔ E ela não existe abaixo de 720px.</p>
    <aside class="sidebar">
      <div class="sidebar-top"><strong>apps</strong></div>
      <div class="sessions">
        <button class="atual"><span>Conversas</span>
          <span class="hint">com o amigo e com quem você encontrou</span></button>
        <button><span>Tarefas</span>
          <span class="hint">o que ele prometeu retomar com você</span></button>
        <button><span>A página</span>
          <span class="hint">o que aparece em okmigo.com/@revenda_norte</span></button>
        <button><span>Gerenciar</span>
          <span class="hint">quem entra, o que aparece e os avisos</span></button>
        <button><span>agenda</span>
          <span class="hint">Seus compromissos · via agenda</span></button>
        <button><span>sohautos</span>
          <span class="hint">O pátio · O balcão · via sohautos</span></button>
        <button><span>comcontabil-cliente</span>
          <span class="hint">Documentos · Obrigações · Guias · Folha · Recados · Balanço · via comcontabil-cliente</span></button>
        <button><span>Financeiro</span>
          <span class="hint">Contas · Saldo · Extrato · Cartões · Categorias · Consentimento · via dinfinance</span></button>
      </div>
      <button class="mais">+ serviços</button>
    </aside>
  </section>

  <section class="lado">
    <h2>app · a gaveta de 304px</h2>
    <p>Com ícone — e o ícone informa: ⊕ é tela nossa, ⧉ veio de um serviço.</p>
    <div class="gaveta">
      <div class="conta">
        <span class="txt"><span class="tt">Revenda Norte</span>
          <span class="sub">conta do negócio</span></span>
      </div>
      <div class="divisor" data-papel="ornamento"></div>
      <div class="rot">apps</div>

      <button class="tile"><svg class="ic" data-papel="icone" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-7a8 8 0 0 1 8-8h2a8 8 0 0 1 8 4z"/></svg>
        <span class="txt"><span class="tt">Conversas</span>
          <span class="sub">com o amigo e com quem você encontrou</span></span></button>

      <button class="tile"><svg class="ic" data-papel="icone" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>
        <span class="txt"><span class="tt">Tarefas</span>
          <span class="sub">o que ele prometeu retomar com você</span></span></button>

      <button class="tile"><svg class="ic" data-papel="icone" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>
        <span class="txt"><span class="tt">A página</span>
          <span class="sub">o que aparece em okmigo.com/@revenda_norte</span></span></button>

      <button class="tile"><svg class="ic" data-papel="icone" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>
        <span class="txt"><span class="tt">Gerenciar</span>
          <span class="sub">quem entra, o que aparece e os avisos</span></span></button>

      <button class="tile"><svg class="ic" data-papel="icone" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6v3h4v13H5V7h4z"/><path d="M9 4v3h6V4"/></svg>
        <span class="txt"><span class="tt">agenda</span>
          <span class="sub">Seus compromissos · via agenda</span></span></button>

      <button class="tile"><svg class="ic" data-papel="icone" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6v3h4v13H5V7h4z"/><path d="M9 4v3h6V4"/></svg>
        <span class="txt"><span class="tt">sohautos</span>
          <span class="sub">O pátio · O balcão · via sohautos</span></span></button>

      <button class="tile"><svg class="ic" data-papel="icone" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6v3h4v13H5V7h4z"/><path d="M9 4v3h6V4"/></svg>
        <span class="txt"><span class="tt">comcontabil-cliente</span>
          <span class="sub">Documentos · Obrigações · Guias · Folha · Recados · Balanço · via comcontabil-cliente</span></span></button>

      <button class="tile"><svg class="ic" data-papel="icone" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6v3h4v13H5V7h4z"/><path d="M9 4v3h6V4"/></svg>
        <span class="txt"><span class="tt">Financeiro</span>
          <span class="sub">Contas · Saldo · Extrato · Cartões · Categorias · Consentimento · via dinfinance</span></span></button>
    </div>
  </section>
</div>
</body></html>
