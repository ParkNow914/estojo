<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estojo · a conversa</title>
<!-- ⚠️ Os valores abaixo foram EXTRAÍDOS do produto (web/src/styles.css, tema
     escuro), não digitados à mão — regerar com `node ferramentas/tokens.mjs`.
     ⛔ E a extração já me traiu: pular os `var()` fez o valor do tema CLARO
     vencer no lugar do escuro, em silêncio. Os `var()` são resolvidos DENTRO
     do tema. -->
<style>
:root {
  --bg: #131211;
  --panel: #1B1918;
  --panel-2: #242120;
  --line: #322E2B;
  --line-controle: #8E867B;
  --line-forte: #443F3B;
  --text: #EDEAE5;
  --muted: #A49C93;
  --fraco: #8F877F;
  --accent: #6EA8FE;
  --accent-forte: #8FBEFF;
  --accent-fraco: #23324A;
  --in-bg: #242120;
  --in-line: #322E2B;
  --out-bg: #23324A;
  --out-line: #2E4260;
  --r-controle: 999px;
  --r-casco: 24px;
  color-scheme: dark;
}
* { box-sizing: border-box }
body { margin:0; background:var(--bg); color:var(--text);
  font:16px/1.5 Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif }
.tela { max-width:390px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column }
header { display:flex; align-items:center; gap:.5rem; padding:.7rem .9rem;
  border-bottom:1px solid var(--line); background:var(--panel) }
header b { color:var(--accent); font-size:1.05rem }
.pilula { margin-left:auto; display:flex; gap:.4rem }
.pilula button { min-height:44px; min-width:44px; padding:0 .8rem; border-radius:var(--r-controle);
  border:1px solid var(--line-forte); background:var(--panel-2); color:var(--text);
  font:inherit; font-size:.85rem }
.fluxo { flex:1; padding:1rem .9rem; display:flex; flex-direction:column; gap:.7rem }
.marco { align-self:center; font-size:.75rem; color:var(--fraco); background:var(--panel);
  border:1px solid var(--line); border-radius:var(--r-controle); padding:.2rem .7rem }
.msg { display:flex; flex-direction:column; max-width:86% }
.msg.eu { align-self:flex-end; align-items:flex-end }
.body { padding:.55rem .8rem; border-radius:12px }
.msg.ele .body { background:var(--in-bg); border:1px solid var(--in-line);
  border-bottom-left-radius:4px }
.msg.eu .body { background:var(--out-bg); border:1px solid var(--out-line);
  border-bottom-right-radius:4px }
.hora { font-size:.72rem; color:var(--fraco); margin-top:.2rem }
.modelo { font-size:.72rem; color:var(--fraco) }
/* ⛔ `width:min(...)` e não `flex:1` solto: a bolha encolhe até o conteúdo, e
   dentro dela um `flex:1` recebe ZERO — a trilha ficava invisível, com
   largura 0. O verificador reprova isso agora, mas o conserto é aqui. */
.voz { display:flex; align-items:center; gap:.6rem; width:min(17rem, 78vw) }
.tocar { width:44px; height:44px; border-radius:50%; border:none; background:var(--accent);
  color:var(--bg); font-size:1rem }
.trilha { flex:1; height:4px; border-radius:2px; background:var(--line-controle) }
.dur { font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums }
.chip { display:flex; align-items:center; gap:.5rem; padding:.45rem .6rem;
  border:1px solid var(--line-controle); border-radius:10px; margin-bottom:.4rem }
.chip .tipo { font-size:.7rem; font-weight:700; color:var(--bg); background:var(--accent);
  border-radius:4px; padding:.1rem .35rem }
.compor { display:flex; align-items:center; gap:.5rem; padding:.7rem .9rem;
  border-top:1px solid var(--line); background:var(--panel) }
.campo { flex:1; min-height:44px; padding:.6rem .9rem; border-radius:var(--r-controle);
  border:1px solid var(--line-controle); background:var(--bg); color:var(--text); font:inherit }
.campo::placeholder { color:var(--fraco) }
.mic { width:44px; height:44px; border-radius:50%; border:none; background:var(--accent);
  color:var(--bg); font-size:1.1rem }
</style></head><body>
<div class="tela">
  <header><b>okmigo</b>
    <span class="pilula"><button>Marina &#9662;</button><button aria-label="Configurações">&#9881;</button></span>
  </header>
  <div class="fluxo">
    <div class="marco">3 de junho</div>
    <div class="msg eu"><div class="body"><p style="margin:0">comprei uma bike usada bem barata, mas a corrente parece bem gasta</p></div><span class="hora">21:24</span></div>
    <div class="msg ele"><div class="body"><p style="margin:0">Boa compra. Corrente gasta come a coroa se rodar muito assim — vale trocar antes de pegar estrada.</p></div><span class="hora">21:24</span><span class="modelo">qwen3.5</span></div>
    <div class="msg eu"><div class="body voz">
      <button class="tocar" aria-label="Tocar">&#9654;</button>
      <span class="trilha" data-papel="grafico"></span>
      <span class="dur">0:07</span></div><span class="hora">16:37</span></div>
    <div class="msg eu"><div class="body">
      <span class="chip" data-papel="grafico"><span class="tipo">CSV</span>tabela-do-fornecedor.csv</span>
      <p style="margin:0">essa aqui</p></div><span class="hora">16:37</span></div>
  </div>
  <div class="compor">
    <input class="campo" placeholder="Escreva uma mensagem…">
    <button class="mic" aria-label="Gravar áudio">&#127908;</button>
  </div>
</div>
</body></html>
